name: release

# Builds the R source tarball on GitHub's runners and publishes it as a
# downloadable asset on a GitHub Release. The version and release notes are read
# from DESCRIPTION and NEWS.md, so cutting a new release only requires bumping
# the version and running this workflow (or pushing a matching version tag).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install build dependencies
        run: |
          install.packages(c(
            "Matrix", "Rcpp", "dplyr", "ggplot2", "ggrepel", "scales",
            "knitr", "rmarkdown", "pheatmap"
          ))
        shell: Rscript {0}

      - name: Build source tarball
        run: R CMD build . --no-build-vignettes

      - name: Read package version and release notes
        id: meta
        run: |
          version=$(grep '^Version:' DESCRIPTION | sed 's/Version:[[:space:]]*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Use the top (most recent) section of NEWS.md as the release body.
          awk '/^# /{n++} n==2{exit} n>=1{print}' NEWS.md > RELEASE_NOTES.md

      # When re-running a release for a version (e.g. dispatching from a branch
      # after a fix), any pre-existing release/tag may point at a stale commit.
      # Delete it so the tag is recreated at the exact commit this tarball was
      # built from, keeping `install_github("...@vX.Y.Z")` consistent with the
      # published asset.
      - name: Reset any stale release/tag for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${{ steps.meta.outputs.version }}" --cleanup-tag --yes || true

      - name: Publish release with the source tarball
        uses: softprops/action-gh-release@v2
        with:
          name: LogicComm ${{ steps.meta.outputs.version }}
          tag_name: v${{ steps.meta.outputs.version }}
          # This branch carries the in-progress cell-type co-expression rewrite,
          # so releases cut from it are published as pre-releases.
          prerelease: true
          # Pin the tag to the exact commit being built. Without this, a tag
          # created on a workflow_dispatch event defaults to the repository's
          # default branch, so dispatching from a feature branch would tag the
          # release at main rather than at the built source.
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: LogicComm_*.tar.gz
          body_path: RELEASE_NOTES.md
